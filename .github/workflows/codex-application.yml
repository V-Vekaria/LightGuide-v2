name: Codex application checks
on:
  push:
    branches: [main, codex/offline-mobile-app]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: codex-application-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm test && npm run build
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck && npm test && npm run export:web && npm run export:android
        working-directory: apps/mobile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
      - run: npm run test:e2e
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-software-evidence
          path: |
            apps/mobile/artifacts/
            apps/mobile/dist-web/
            apps/mobile/dist-android/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the previously built APK has identical application source
        # Release-scoped reuse for PR #4 while repairing only its test driver.
        # Other PRs, main and any source change take the normal build path.
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 4
        id: apk-source
        run: |
          if git diff --quiet d7bb97ec25d67ffedb06b6d262342bad329b69f7 HEAD -- . ':!apps/mobile/scripts/android-smoke.py' ':!.github/workflows/codex-application.yml'; then
            echo 'unchanged=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse the exact APK for smoke-driver-only changes
        if: steps.apk-source.outputs.unchanged == 'true'
        id: reuse-apk
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lightguide-codex-android
          run-id: 35421252935
          github-token: ${{ github.token }}
          path: apps/mobile/android/app/build/outputs/apk/release
      - name: Verify reused APK identity
        if: steps.reuse-apk.outcome == 'success'
        run: echo '3247bea7aa42eed81a217af7a3f6f6726b717fb8519b5bc3136514e4324c563d  apps/mobile/android/app/build/outputs/apk/release/app-release.apk' | sha256sum --check
      - uses: actions/setup-node@v4
        if: steps.reuse-apk.outcome != 'success'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        if: steps.reuse-apk.outcome != 'success'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        if: steps.reuse-apk.outcome != 'success'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        if: steps.reuse-apk.outcome != 'success'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
        if: steps.reuse-apk.outcome != 'success'
      - run: npm ci && npx expo prebuild --platform android --no-install
        if: steps.reuse-apk.outcome != 'success'
        working-directory: apps/mobile
      - name: Build standalone evaluation APK with embedded JavaScript
        if: steps.reuse-apk.outcome != 'success'
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lightguide-codex-android
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  android-smoke:
    # Native compilation fills the build runner. Test the uploaded APK on a
    # fresh runner, without reinstalling Node dependencies or Gradle caches.
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: lightguide-codex-android
          path: apps/mobile/android/app/build/outputs/apk/release
      - name: Download previous verified APK for in-place upgrade check
        uses: actions/download-artifact@v4
        with:
          name: lightguide-codex-android
          run-id: 35259336228
          github-token: ${{ github.token }}
          path: apps/mobile/artifacts/upgrade-baseline
      - name: Record tested APK identity and available space
        run: |
          sha256sum apps/mobile/android/app/build/outputs/apk/release/*.apk
          df -h /
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed Android application offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: cd apps/mobile && python scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-android-smoke-evidence
          path: apps/mobile/artifacts/android-smoke/
          if-no-files-found: error

  positioning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
        working-directory: experiments/phase-0-ar-positioning/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightguide-codex-positioning
          path: |
            experiments/phase-0-ar-positioning/android/app/build/outputs/apk/debug/*.apk
            experiments/phase-0-ar-positioning/android/app/build/reports/tests/
